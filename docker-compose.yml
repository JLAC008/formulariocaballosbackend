services:
  db:
    image: postgres:16-alpine
    container_name: formulario-caballos-postgres
    restart: unless-stopped
    profiles: ["local"]
    environment:
      POSTGRES_DB: ${DB_NAME:-formulariocaballos}
      POSTGRES_USER: ${DB_USER:-formulariocaballos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-formulariocaballos_secret}
    ports:
      - "5433:5432"
    volumes:
      - formulario_caballos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-formulariocaballos} -d ${DB_NAME:-formulariocaballos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${EXTERNAL_PORT:-8081}:8083"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/formulariocaballos}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-formulariocaballos}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-formulariocaballos_secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-${FRONTEND_URL}}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_AUTH: ${MAIL_AUTH}
      MAIL_STARTTLS: ${MAIL_STARTTLS}
      MAIL_FROM: ${MAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy
        required: false

volumes:
  formulario_caballos_pgdata:
