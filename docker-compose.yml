services:
  db:
    image: postgres:16-alpine
    container_name: formulario-caballos-postgres
    restart: unless-stopped
    profiles: ["local"]
    environment:
      POSTGRES_DB: ${DB_NAME:-formulariocaballos}
      POSTGRES_USER: ${DB_USER:-formulariocaballos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-formulariocaballos_secret}
    ports:
      - "5433:5432"
    volumes:
      - formulario_caballos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-formulariocaballos} -d ${DB_NAME:-formulariocaballos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8083:8081"
    environment:
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5433}
      DB_NAME: ${DB_NAME:-formulariocaballos}
      DB_USER: ${DB_USER:-formulariocaballos}
      DB_PASSWORD: ${DB_PASSWORD:-formulariocaballos_secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-${FRONTEND_URL}}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      MAIL_FROM: ${MAIL_FROM}
      BREVO_API_KEY: ${BREVO_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-eur}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
        required: false
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  formulario_caballos_pgdata:
  uploads_data:
