services:
  db:
    image: postgres:16-alpine
    container_name: formulario-caballos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: formulariocaballos
      POSTGRES_USER: formulariocaballos
      POSTGRES_PASSWORD: formulariocaballos_secret
    ports:
      - "5433:5432"
    volumes:
      - formulario_caballos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formulariocaballos -d formulariocaballos"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/formulariocaballos
      SPRING_DATASOURCE_USERNAME: formulariocaballos
      SPRING_DATASOURCE_PASSWORD: formulariocaballos_secret
      CORS_ORIGINS: http://localhost:4200
    depends_on:
      db:
        condition: service_healthy

volumes:
  formulario_caballos_pgdata:
