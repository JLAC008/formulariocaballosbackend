spring:
  docker:
    compose:
      profiles:
        active: local
  application:
    name: formulario-caballos-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:formulariocaballos}
    username: ${DB_USER:formulariocaballos}
    password: ${DB_PASSWORD:formulariocaballos_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  admin:
    username: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:change-me-in-production}
  jwt:
    secret: ${JWT_SECRET:base64-encoded-256-bit-secret-for-jwt-signing-at-least-32-chars}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:${FRONTEND_URL:http://localhost:4200}}
  mail:
    from: ${MAIL_FROM:no-reply@formulariocaballos.local}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: ${STRIPE_CURRENCY:eur}
    bonus-pack-amount: ${STRIPE_BONUS_PACK_AMOUNT:10}
    bonus-pack-price-cents: ${STRIPE_BONUS_PACK_PRICE_CENTS:16000}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    admin-to: ${WHATSAPP_ADMIN_TO:}
    template-booking: ${WHATSAPP_TEMPLATE_BOOKING:booking_confirmation}
    template-cancellation: ${WHATSAPP_TEMPLATE_CANCELLATION:booking_cancellation}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:es_ES}
server:
  port: ${SERVER_PORT:8081}
logging:
  level:
    com.formulariocaballos: DEBUG
    org.flywaydb: INFO
