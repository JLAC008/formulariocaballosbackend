spring:
  application:
    name: formulario-caballos-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/formulariocaballos}
    username: ${SPRING_DATASOURCE_USERNAME:formulariocaballos}
    password: ${SPRING_DATASOURCE_PASSWORD:formulariocaballos_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  sql:
    init:
      mode: always
      continue-on-error: false
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  jwt:
    secret: ${JWT_SECRET:base64-encoded-256-bit-secret-for-jwt-signing-at-least-32-chars}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
server:
  port: ${SERVER_PORT:8081}
logging:
  level:
    com.formulariocaballos: DEBUG
    org.flywaydb: INFO
