spring:
  docker:
    compose:
      profiles:
        active: local
  application:
    name: formulario-caballos-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:formulariocaballos}
    username: ${DB_USER:formulariocaballos}
    password: ${DB_PASSWORD:formulariocaballos_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  admin:
    username: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:change-me-in-production}
  jwt:
    secret: ${JWT_SECRET:base64-encoded-256-bit-secret-for-jwt-signing-at-least-32-chars}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:${FRONTEND_URL:http://localhost:4200}}
  auth:
    email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:true}
  mail:
    from: ${MAIL_FROM:no-reply@formulariocaballos.local}
    brevo-api-key: ${BREVO_API_KEY:}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: ${STRIPE_CURRENCY:eur}
server:
  port: ${SERVER_PORT:8083}
logging:
  level:
    com.formulariocaballos: DEBUG
    org.flywaydb: INFO
